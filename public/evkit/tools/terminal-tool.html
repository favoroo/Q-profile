    'JBTC-TSL-2PINL-2-COP': { 'HV+': [476.92, 526.29], 'HV-': [484.12, 430.89] },
    'JBTC-TSL-2PINL-2-HAR': { 'HV+': [403.12, 259.89], 'HV-': [536.32, 258.09] },
    'JBTC-TSL-2PINS-2-COP': { 'HV+': [358.12, 382.29], 'HV-': [545.32, 387.69] },
    'JBTC-TSL-2PINS-2-HAR': { 'HV+': [566.92, 409.29], 'HV-': [361.72, 407.49] },
    'JBTC-TSL-5PIN-1-COP': { 'HV+': [448.12, 267.09], 'HV-': [530.92, 261.69] },
    'JBTC-TSL-5PIN-1-HAR': { 'HV+': [487.72, 229.29], 'HV-': [485.92, 150.09] },
    'JBTC-TSL-5PIN-1-COP2': { 'HV+': [448.12, 375.09], 'HV-': [534.52, 378.69] },
    'JBTC-TSL-5PIN-1-HAR2': { 'HV+': [392.32, 229.29], 'HV-': [390.52, 142.89] },
    'JBTC-TSL-5PIN-1-COP-OBC': { 'AC-L1': [527.32, 249.09], 'AC-L2': [529.12, 369.69], 'AC-L3': [446.32, 245.49], 'AC-N': [446.32, 371.49] },
    'JBTC-TSL-5PIN-1-HAR-OBC': { 'AC-L1': [496.72, 137.49], 'AC-L2': [386.92, 139.29], 'AC-L3': [500.32, 213.09], 'AC-N': [388.72, 213.09] },
    'JBTC-VW-2PINL-1-COP': { 'HV+': [208.80, 365.58], 'HV-': [671.40, 367.38] },
    'JBTC-VW-6PINS-1-COP': { 'U': [152.40, 258.00], 'V': [351.00, 261.60], 'W': [551.40, 258.60] },
    'JBTC-VW-2PINS-1-COP': { 'HV+': [207.00, 350.40] }
  };

  var annotations = load();
  var current = null;
  var activeLabel = null;
  var pending = null;
  var history = [];

  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('canvas');
  var ctx = canvas.getContext('2d');
  var wrap = $('canvas-wrapper');
  var marker = $('point-marker');
  var toastTimer = null;

  function toast(msg, type) {
    var el = $('toast');
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, 2400);
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* ignore */ }
    return JSON.parse(JSON.stringify(SEED));
  }
  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(annotations)); } catch (e) { /* ignore */ }
  }

  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ }
      document.body.removeChild(ta);
      done(ok);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallback(); });
    } else {
      fallback();
    }
  }

  /* ── 完成规则（原版）：HV+&HV- 或 U&V&W 或 AC-L1&AC-N ── */
  function isCompleted(ann) {
    if (!ann) return false;
    var has = function (k) { return Object.prototype.hasOwnProperty.call(ann, k); };
    return (has('HV+') && has('HV-')) || (has('U') && has('V') && has('W')) || (has('AC-L1') && has('AC-N'));
  }

  /* ── 绘制：固定 1000×750 缓冲（源图即 900×675 同比例），不随容器尺寸变形 ── */
  var drawToken = 0;
  function drawImage(name) {
    $('canvas-placeholder').style.display = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var token = ++drawToken;
    var img = new Image();
    img.onload = function () {
      if (token !== drawToken) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    };
    img.onerror = function () {
      if (token !== drawToken) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      $('canvas-placeholder').style.display = 'flex';
      $('canvas-placeholder').innerHTML = '<span class="big">⚠️</span><span>图片加载失败：' + name + '</span>';
    };
    img.src = IMAGE_ROOT + encodeURIComponent(name) + '.webp';
  }

  function setPending(x, y) {
    pending = { x: x, y: y };
    marker.style.left = (x / COORD_MAX_X * 100) + '%';
    marker.style.top = (y / COORD_MAX_Y * 100) + '%';
    marker.style.display = 'block';
    $('coord-input').value = x.toFixed(2) + ',' + y.toFixed(2);
    $('btn-copy-coords').disabled = false;
    refreshSaveBtn();
  }

  function refreshSaveBtn() {
    var ok = activeLabel && pending && current;
    $('btn-complete').disabled = !ok;
    $('btn-complete').textContent = ok ? '完成 / 保存 ' + activeLabel : '完成 / 保存此点';
  }

  function renderLabels() {
    var grid = $('label-container');
    grid.innerHTML = '';
    LABELS.forEach(function (lb) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'label-btn' + (lb === activeLabel ? ' active' : '');
      btn.textContent = lb;
      btn.addEventListener('click', function () { selectLabel(lb); });
      grid.appendChild(btn);
    });
  }

  function selectLabel(lb) {
    activeLabel = lb;
    pending = null;
    marker.style.display = 'none';
    var ann = current ? annotations[current] : null;
    if (ann && ann[lb]) {
      setPending(ann[lb][0], ann[lb][1]);
      toast('「' + lb + '」已有标注，可重新点击图上位置修改后保存');
    } else {
      $('coord-input').value = '';
      $('coord-input').placeholder = '选择「' + lb + '」后点击图上位置';
    }
    refreshSaveBtn();
    renderLabels();
  }

  function selectImage(name) {
    current = name;
    activeLabel = null;
    pending = null;
    marker.style.display = 'none';
    var nameEl = $('display-name');
    nameEl.textContent = name;
    nameEl.classList.remove('empty');
    $('btn-copy-name').disabled = false;
    $('btn-copy-coords').disabled = true;
    $('coord-input').value = '';
    $('coord-input').placeholder = '点击图片后显示坐标';
    $('load-input').value = '';
    drawImage(name);
    renderLabels();
    renderRows();
    refreshSaveBtn();
  }

  function savePoint() {
    if (!current || !activeLabel || !pending) return;
    var ann = annotations[current] || (annotations[current] = {});
    var prev = ann[activeLabel] || null;
    ann[activeLabel] = [pending.x, pending.y];
    history.push({ type: 'ADD', img: current, label: activeLabel, prevVal: prev });
    persist();
    toast('已保存 ' + activeLabel + ' @ ' + pending.x.toFixed(2) + ',' + pending.y.toFixed(2), 'success');
    renderLabels();
    renderRows();
    refreshSaveBtn();
  }

  function deletePoint(img, label) {
    var ann = annotations[img];
    if (!ann || !ann[label]) return;
    history.push({ type: 'DELETE', img: img, label: label, prevVal: ann[label].slice() });
    delete ann[label];
    if (current === img && activeLabel === label) {
      pending = null;
      marker.style.display = 'none';
      $('coord-input').value = '';
      refreshSaveBtn();
    }
    persist();
    toast('已删除 ' + img + ' 的 ' + label + '（Ctrl+Z 可撤销）');
    renderLabels();
    renderRows();
  }

  function undo() {
    var h = history.pop();
    if (!h) { toast('没有可撤销的操作'); return; }
    var ann = annotations[h.img] || (annotations[h.img] = {});
    if (h.type === 'ADD') {
      if (h.prevVal) { ann[h.label] = h.prevVal.slice(); } else { delete ann[h.label]; }
    } else {
      ann[h.label] = h.prevVal.slice();
    }
    persist();
    selectImage(h.img);
    toast('已撤销', 'success');
  }

  /* ── 图库行 ── */
  function renderRows() {
    var box = $('gallery-container');
    box.innerHTML = '';
    var search = $('search-input').value.trim().toLowerCase();
    var todoOnly = $('filter-unannotated').checked;
    var shown = 0;

    IMAGES.forEach(function (name) {
      if (search && name.toLowerCase().indexOf(search) === -1) return;
      var ann = annotations[name] || {};
      var labels = Object.keys(ann).filter(function (k) { return k !== 'remark'; }); /* 兼容旧版本地数据中残留的 remark 字段 */
      var done = isCompleted(ann);
      if (todoOnly && done) return;
      shown++;

      var row = document.createElement('div');
      row.className = 'gallery-row' + (name === current ? ' current' : '');

      /* 主缩略图 */
      var thumb = document.createElement('div');
      thumb.className = 'main-thumb-box' + (name === current ? ' selected' : '');
      var img = document.createElement('img');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.src = IMAGE_ROOT + encodeURIComponent(name) + '.webp';
      img.alt = name;
      var nm = document.createElement('div');
      nm.className = 'main-thumb-name';
      nm.textContent = name;
      thumb.appendChild(img);
      thumb.appendChild(nm);
      thumb.addEventListener('click', function () { selectImage(name); });
      row.appendChild(thumb);
      /* 已标注列表 */
      var list = document.createElement('div');
      list.className = 'annotated-list';
      labels.forEach(function (lb) {
        var item = document.createElement('div');
        item.className = 'anno-item' + (name === current && lb === activeLabel ? ' active-anno' : '');
        var box2 = document.createElement('div');
        box2.className = 'anno-item-img-box';
        var cimg = document.createElement('img');
        cimg.loading = 'lazy';
        cimg.src = IMAGE_ROOT + encodeURIComponent(name) + '.webp';
        cimg.alt = '';
        var pt = document.createElement('div');
        pt.className = 'mini-point';
        pt.style.left = (ann[lb][0] / COORD_MAX_X * 100) + '%';
        pt.style.top = (ann[lb][1] / COORD_MAX_Y * 100) + '%';
        box2.appendChild(cimg);
        box2.appendChild(pt);
        var tag = document.createElement('div');
        tag.className = 'anno-label-tag';
        tag.textContent = lb;
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'btn-delete-anno';
        del.textContent = '×';
        del.title = '删除 ' + lb;
        del.addEventListener('click', function (e) { e.stopPropagation(); deletePoint(name, lb); });
        item.appendChild(box2);
        item.appendChild(tag);
        item.appendChild(del);
        item.addEventListener('click', function () {
          selectImage(name);
          selectLabel(lb);
        });
        list.appendChild(item);
      });
      row.appendChild(list);

      box.appendChild(row);
    });

    if (!shown) {
      var empty = document.createElement('div');
      empty.style.cssText = 'text-align:center;color:#999;margin-top:50px;';
      empty.textContent = '没有符合条件的图片';
      box.appendChild(empty);
    }
    updateCount();
  }

  function visibleImages() {
    var search = $('search-input').value.trim().toLowerCase();
    return IMAGES.filter(function (n) {
      return !search || n.toLowerCase().indexOf(search) !== -1;
    });
  }

  function updateCount() {
    var vis = visibleImages();
    $('result-count').textContent = '共 ' + vis.length + ' 张';
  }

  /* ── 画布点击 → 900×675 虚拟坐标 ── */
  wrap.addEventListener('click', function (e) {
    if (!current) { toast('请先在右侧选择连接器端子图'); return; }
    if (!activeLabel) { toast('请先选择端子标签（HV+ / HV- / AC-L1 …）'); return; }
    var rect = wrap.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width * COORD_MAX_X;
    var y = (e.clientY - rect.top) / rect.height * COORD_MAX_Y;
    x = Math.min(Math.max(x, 0), COORD_MAX_X);
    y = Math.min(Math.max(y, 0), COORD_MAX_Y);
    setPending(Math.round(x * 100) / 100, Math.round(y * 100) / 100);
  });

  /* ── 按钮 ── */
  $('btn-complete').addEventListener('click', savePoint);
  $('btn-copy-name').addEventListener('click', function () {
    if (current) copyText(current, function (ok) { toast(ok ? '已复制图号' : '复制失败', ok ? 'success' : ''); });
  });
  $('btn-copy-coords').addEventListener('click', function () {
    if (!pending) return;
    copyText(pending.x.toFixed(2) + ',' + pending.y.toFixed(2), function (ok) { toast(ok ? '已复制坐标' : '复制失败', ok ? 'success' : ''); });
  });

  function locate() {
    if (!current) { toast('请先选择图片'); return; }
    var parts = $('manual-input').value.trim().split(/[,，\s]+/).filter(Boolean);
    if (parts.length !== 2 || isNaN(parseFloat(parts[0])) || isNaN(parseFloat(parts[1]))) {
      toast('坐标格式：259.20,343.98'); return;
    }
    var x = Math.min(Math.max(parseFloat(parts[0]), 0), COORD_MAX_X);
    var y = Math.min(Math.max(parseFloat(parts[1]), 0), COORD_MAX_Y);
    setPending(Math.round(x * 100) / 100, Math.round(y * 100) / 100);
    toast('已定位：' + x.toFixed(2) + ', ' + y.toFixed(2), 'success');
  }
  $('btn-locate').addEventListener('click', locate);
  $('manual-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') locate(); });

  function loadByName() {
    var q = $('load-input').value.trim().toLowerCase();
    if (!q) return;
    var hit = IMAGES.find(function (n) { return n.toLowerCase().indexOf(q) !== -1; });
    if (hit) { selectImage(hit); toast('已加载：' + hit, 'success'); }
    else toast('未找到图号包含「' + q + '」的图片');
  }
  $('btn-load').addEventListener('click', loadByName);
  $('load-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadByName(); });

  $('search-input').addEventListener('input', renderRows);
  $('filter-unannotated').addEventListener('change', renderRows);
  $('btn-refresh').addEventListener('click', function () { renderRows(); toast('列表已刷新'); });

  $('btn-reset').addEventListener('click', function () {
    annotations = JSON.parse(JSON.stringify(SEED));
    history = [];
    persist();
    renderRows();
    renderLabels();
    toast('已重置为预置示例数据', 'success');
  });

  /* ── 键盘 ── */
  document.addEventListener('keydown', function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    var inInput = tag === 'INPUT' || tag === 'TEXTAREA';
    var k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); savePoint(); return; }
    if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); undo(); return; }
    if (inInput) return;
    if (e.key === ' ') { e.preventDefault(); savePoint(); return; }
    if (KEYMAP[k]) selectLabel(KEYMAP[k]);
  });

  /* ── 初始 ── */
  renderLabels();
  selectImage(IMAGES[0]); /* JBTC-TSL-2PINL-1-COP */
})();
</script>
</body>
</html>
