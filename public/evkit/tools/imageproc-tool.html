<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVBOX 图片处理工具 · 在线演示</title>
<style>
  /* ===== 按 Nano-flask 原工具 1:1 还原（浅色批处理模式） ===== */
  :root {
    --bg-app: #f8fafc;
    --panel: #ffffff;
    --panel-h: #f1f5f9;
    --bg-input: #f8fafc;
    --ink: #0f172a;
    --sub: #475569;
    --muted: #64748b;
    --line: #e2e8f0;
    --line-hover: #cbd5e1;
    --primary: #1a73e8;
    --primary-h: #1558d6;
    --grad: linear-gradient(135deg, #1a73e8 0%, #1558d6 100%);
    --success: #059669;
    --danger: #dc2626;
    --warning: #d97706;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: MiSans, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: var(--bg-app);
    color: var(--ink);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .bi { width: 16px; height: 16px; display: inline-block; fill: currentColor; vertical-align: -0.125em; flex: none; }
  button { font-family: inherit; }

  /* ── 顶部导航 ── */
  .top-nav {
    flex: none; height: 60px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 20px;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    position: relative; z-index: 10;
  }
  .nav-left, .nav-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; flex: none; }
  .brand-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--grad); color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  }
  .brand-icon .bi { width: 19px; height: 19px; }
  .brand-text { font-size: 19px; font-weight: 800; letter-spacing: -0.4px; color: var(--ink); white-space: nowrap; line-height: 1; }
  .brand-text .hl {
    background: var(--grad); -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent; margin-left: 2px;
  }
  .mode-switch {
    display: inline-flex; gap: 4px; padding: 4px; margin-left: 10px;
    border-radius: 999px; background: #eef2f7; border: 1px solid var(--line);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
  }
  .mode-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 17px; border: none; border-radius: 999px;
    background: transparent; color: var(--sub);
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .mode-btn .bi { width: 14px; height: 14px; }
  .mode-btn:hover { background: rgba(59, 130, 246, 0.08); color: var(--primary); }
  .mode-btn.active { background: var(--grad); color: #fff; box-shadow: 0 2px 8px rgba(26, 115, 232, 0.3); }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    border: 1px solid var(--line); background: #fff; color: var(--sub);
    display: grid; place-items: center; cursor: pointer;
    box-shadow: var(--shadow-sm); transition: all 0.2s;
  }
  .icon-btn .bi { width: 17px; height: 17px; }
  .icon-btn:hover { background: var(--primary); border-color: var(--primary); color: #fff; transform: translateY(-2px); }
  .view-toggle { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: #fff; flex: none; }
  .vt-btn {
    width: 32px; height: 28px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; color: var(--sub); display: grid; place-items: center; cursor: pointer;
    transition: all 0.18s;
  }
  .vt-btn .bi { width: 14px; height: 14px; }
  .vt-btn:hover { border-color: var(--line-hover); color: var(--primary); }
  .vt-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .ghost-btn {
    display: inline-flex; align-items: center; gap: 7px; flex: none;
    padding: 7px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; color: #334155; font-size: 13px; font-weight: 600;
    cursor: pointer; white-space: nowrap; transition: all 0.18s;
  }
  .ghost-btn .bi { width: 14px; height: 14px; }
  .ghost-btn:hover { border-color: var(--primary); color: var(--primary); }
  .ghost-btn.dark { border-color: #34405a; color: var(--ink); }
  .ghost-btn.dark:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
  .user-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; white-space: nowrap; }
  .u-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 5px var(--success); flex: none; }
  .u-name { font-weight: 700; color: var(--ink); }
  .u-id { color: var(--muted); font-size: 12.5px; }
  .u-out { color: var(--danger); font-size: 12.5px; text-decoration: none; font-weight: 500; background: none; border: none; padding: 0; cursor: pointer; }
  .u-out:hover { text-decoration: underline; }
  .vr { width: 1px; height: 20px; background: var(--line); flex: none; }

  /* ── 主布局：左输入 / 中输出 / 右控制面板（平铺 + 分隔线） ── */
  .workspace { flex: 1; min-height: 0; display: flex; }
  .pane { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .pane-input { border-right: 1px solid var(--line); }
  .pane-head {
    flex: none; min-height: 50px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 16px; border-bottom: 1px solid var(--line);
  }
  .ph-left, .ph-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ph-right { flex: none; }
  .pane-title {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 13px; border-radius: 999px;
    font-size: 13.5px; font-weight: 700; white-space: nowrap;
  }
  .pane-title .bi { width: 15px; height: 15px; }
  .pane-title.t-input { color: #1f2937; background: #fff; border: 1px solid #dbe3ec; box-shadow: var(--shadow-sm); }
  .pane-title.t-input .bi { color: var(--primary); }
  .pane-title.t-output { color: var(--success); background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.28); }
  .ph-count { font-size: 13.5px; font-weight: 700; color: #334155; }
  .count-badge {
    font-size: 11.5px; font-weight: 700; color: var(--success);
    background: rgba(16, 185, 129, 0.14); border-radius: 999px; padding: 2.5px 10px;
  }
  .sel-status {
    font-size: 11.5px; padding: 2.5px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--sub); white-space: nowrap;
  }
  .sel-status.is-hidden { display: none; }
  .ck {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 13px; color: var(--sub); cursor: pointer; user-select: none;
  }
  .ck input {
    appearance: none; -webkit-appearance: none; margin: 0;
    width: 17px; height: 17px; border-radius: 50%;
    border: 1.5px solid var(--line-hover); background: #fff;
    display: grid; place-content: center; cursor: pointer; transition: all 0.15s;
  }
  .ck input::before {
    content: ""; width: 9px; height: 9px; transform: scale(0);
    transition: transform 0.12s ease-in-out; background: #fff;
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
  }
  .ck input:checked { background: var(--primary); border-color: var(--primary); }
  .ck input:checked::before { transform: scale(1); }
  .sq-btn {
    width: 30px; height: 30px; border: none; border-radius: 8px; flex: none;
    background: transparent; display: grid; place-items: center;
    cursor: pointer; color: var(--danger); transition: background 0.15s;
  }
  .sq-btn .bi { width: 15px; height: 15px; }
  .sq-btn:hover { background: rgba(220, 38, 38, 0.08); }
  .sq-btn.success { color: var(--success); }
  .sq-btn.success:hover { background: rgba(5, 150, 105, 0.08); }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 20px; border: none; border-radius: 999px;
    background: var(--primary); color: #fff;
    font-size: 13.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
    box-shadow: var(--shadow-sm); transition: all 0.18s;
  }
  .pill-btn .bi { width: 15px; height: 15px; }
  .pill-btn:hover { background: var(--primary-h); transform: translateY(-2px); box-shadow: var(--shadow-md); }

  /* ── 画廊网格 ── */
  .gallery {
    flex: 1 1 0; min-height: 0; overflow-y: auto;
    padding: 20px; display: grid; gap: 16px;
    align-content: start; justify-content: center; grid-auto-rows: max-content;
  }
  .gallery.g-sm { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .gallery.g-md { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .gallery.g-lg { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  #outputGallery.is-empty { display: flex; align-items: center; justify-content: center; }

  /* ── 图片卡片（正方形封面 + 卡内文件名条 + 圆形勾选） ── */
  .img-card {
    position: relative; background: #fff; overflow: hidden;
    border-radius: 12px; border: 2px solid transparent;
    box-shadow: var(--shadow-sm); will-change: transform;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .img-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg), 0 0 0 2px rgba(59, 130, 246, 0.25);
  }
  .img-card.selected { border-color: var(--primary); }
  .img-wrap { aspect-ratio: 1 / 1; background: var(--panel-h); }
  .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .file-name {
    padding: 8px 10px; font-size: 11.5px; font-weight: 500; color: var(--sub);
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-top: 1px solid #f1f5f9; background: #fff;
  }
  .img-card.selected .file-name { color: var(--primary); background: var(--panel-h); }
  .card-check {
    position: absolute; top: 8px; left: 8px; z-index: 5; margin: 0;
    appearance: none; -webkit-appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid var(--line-hover); background: #fff;
    display: grid; place-content: center; cursor: pointer;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    opacity: 0; transition: all 0.15s;
  }
  .card-check::before {
    content: ""; width: 10px; height: 10px; transform: scale(0);
    transition: transform 0.12s ease-in-out; background: #fff;
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
  }
  .card-check:checked { background: var(--primary); border-color: var(--primary); opacity: 1; }
  .card-check:checked::before { transform: scale(1); }
  .img-card:hover .card-check { opacity: 1; }
  .card-actions {
    position: absolute; top: 8px; right: 8px; z-index: 5;
    display: flex; gap: 2px; padding: 3px; border-radius: 999px;
    background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
    opacity: 0; transform: translateY(-5px);
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .img-card:hover .card-actions { opacity: 1; transform: translateY(0); }
  .act-circle {
    width: 30px; height: 30px; border: none; border-radius: 50%;
    background: transparent; color: #fff;
    display: grid; place-items: center; cursor: pointer;
  }
  .act-circle .bi { width: 15px; height: 15px; }
  .act-circle:hover { background: var(--primary); }
  .act-circle.del:hover { background: var(--danger); }
  .zoom-btn {
    position: absolute; bottom: 8px; right: 8px; z-index: 5;
    width: 32px; height: 32px; border: none; border-radius: 50%;
    background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); color: #fff;
    display: grid; place-items: center; cursor: pointer;
    opacity: 0; transform: scale(0.8);
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .zoom-btn .bi { width: 15px; height: 15px; }
  .img-card:hover .zoom-btn { opacity: 1; transform: scale(1); }
  .zoom-btn:hover { background: var(--primary); }
  .img-card.output { animation: rise 0.35s ease; }
  .new-badge {
    position: absolute; top: 10px; right: 10px; z-index: 6;
    background: #16a34a; color: #fff;
    font-size: 10.5px; font-weight: 700; padding: 2.5px 9px;
    border-radius: 999px; box-shadow: 0 2px 6px rgba(5, 150, 105, 0.35);
    transition: opacity 0.15s; pointer-events: none;
  }
  .img-card:hover .new-badge { opacity: 0; }

  /* ── 上传占位（棋盘格虚线块，与卡片同尺寸） ── */
  .upload-placeholder {
    aspect-ratio: 1 / 1; min-width: 130px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 9px; padding: 14px; text-align: center;
    border: 2px dashed var(--line-hover); border-radius: 16px;
    cursor: pointer; color: var(--sub); font-family: inherit;
    background-color: #fff;
    background-image:
      repeating-linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%, #fff),
      repeating-linear-gradient(45deg, #fff 25%, #f8fafc 25%, #f8fafc 75%, #fff 75%, #fff);
    background-position: 0 0, 10px 10px; background-size: 20px 20px;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.03);
    transition: all 0.2s;
  }
  .upload-placeholder:hover {
    border-color: var(--primary); color: var(--primary);
    background-color: rgba(59, 130, 246, 0.06); transform: translateY(-3px);
    box-shadow: var(--shadow-md), inset 0 1px 2px rgba(0, 0, 0, 0.03);
  }
  .up-icon { color: var(--primary); opacity: 0.75; }
  .up-icon .bi { width: 42px; height: 42px; }
  .up-t1 { font-size: 15px; font-weight: 700; color: #334155; white-space: nowrap; }
  .up-t2 { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .upload-placeholder:hover .up-t1, .upload-placeholder:hover .up-icon { color: var(--primary); opacity: 1; }

  /* ── 输出区空态 ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    opacity: 0.55; user-select: none; pointer-events: none;
    text-align: center; padding: 20px;
  }
  .empty-state .es-icon .bi { width: 46px; height: 46px; color: #94a3b8; }
  .es-main { font-size: 15.5px; font-weight: 600; color: var(--sub); margin-top: 8px; white-space: nowrap; }
  .es-sub { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .empty-guide {
    margin-top: 18px; display: flex; align-items: center; gap: 10px;
    color: var(--primary); font-weight: 600; font-size: 13px; letter-spacing: 0.2px;
    animation: floatGuide 2.6s ease-in-out infinite; white-space: nowrap;
  }
  .empty-guide .bi { width: 22px; height: 22px; filter: drop-shadow(0 6px 10px rgba(59, 130, 246, 0.2)); }
  @keyframes floatGuide {
    0%, 100% { transform: translateX(0); opacity: 0.8; }
    50% { transform: translateX(8px); opacity: 1; }
  }

  /* ── 右侧控制面板 ── */
  .sidebar {
    flex: none; width: 284px;
    background: #fff; border-left: 1px solid var(--line);
    box-shadow: -2px 0 12px rgba(0, 0, 0, 0.04);
    overflow-y: auto; display: flex; flex-direction: column;
  }
  .sb-body { padding: 16px 16px 8px; }
  .sb-title { margin: 0 0 14px; font-size: 15px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 9px; }
  .sb-title .bi { width: 17px; height: 17px; }
  .cta-block {
    background: var(--panel-h); border: 1px solid var(--line);
    border-radius: 16px; padding: 12px; box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px;
  }
  .run-btn {
    width: 100%; border: none; border-radius: 999px;
    background: var(--primary); color: #fff;
    padding: 13px 10px 11px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    box-shadow: var(--shadow-sm); transition: all 0.2s;
  }
  .run-btn:hover { background: var(--primary-h); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .run-btn:active { transform: translateY(0); }
  .run-btn .rl1 { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 700; }
  .run-btn .rl1 .bi { width: 20px; height: 20px; }
  .run-btn .rl2 { font-size: 12px; opacity: 0.78; }
  .run-btn.stop { background: var(--danger); }
  .process-progress {
    padding: 8px 10px; border-radius: 10px;
    background: #fff; border: 1px solid var(--line);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
    opacity: 0; transition: opacity 0.3s;
  }
  .process-progress.show { opacity: 1; }
  .pp-text { font-size: 11.5px; color: var(--muted); margin-bottom: 5px; min-height: 14px; }
  .pp-track { height: 8px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
  .pp-fill { height: 100%; width: 0%; border-radius: 999px; background: var(--success); transition: width 0.25s; }
  .sb-label {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: 8px;
  }
  .sb-label.ink { color: var(--ink); }
  .sb-label .bi { width: 14px; height: 14px; }
  .api-select {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 2px; transition: all 0.2s;
  }
  .api-select:hover { border-color: var(--primary); box-shadow: var(--shadow-sm); }
  .api-select select { border: none; background: transparent; font-weight: 700; font-size: 13.5px; cursor: pointer; }
  .sb-hr { border: none; border-top: 1px solid var(--line); opacity: 0.7; margin: 15px 2px; }
  .soft-select, .sb-ta {
    width: 100%; font-family: inherit; color: var(--ink);
    background: var(--bg-input); border: 1px solid var(--line); border-radius: 12px;
    font-size: 13.5px; padding: 10px 12px; outline: none;
    transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
  }
  .soft-select { font-weight: 600; cursor: pointer; }
  .sb-ta { min-height: 112px; resize: vertical; line-height: 1.6; font-size: 12.5px; }
  .soft-select:focus, .sb-ta:focus {
    border-color: var(--primary); background: #fff;
    box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
  }
  .preset-note { font-size: 11px; color: var(--muted); min-height: 14px; margin: 6px 0 2px; }
  .outline-btn {
    width: 100%; margin-top: 9px; padding: 9px 0;
    border-radius: 10px; border: 1px solid var(--line);
    background: #fff; color: #334155; font-size: 13px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: all 0.18s;
  }
  .outline-btn .bi { width: 14px; height: 14px; }
  .outline-btn:hover { border-color: var(--primary); color: var(--primary); }
  .param-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .param-name { font-size: 12.5px; color: var(--muted); }
  .badge-pill {
    font-size: 11.5px; font-weight: 700; padding: 2px 10px;
    border-radius: 999px; border: 1px solid var(--line); background: #f8fafc;
  }
  .badge-pill.blue { color: var(--primary); }
  .badge-pill.dark { color: #334155; }
  .sb-range { width: 100%; accent-color: var(--primary); margin: 2px 0 12px; }
  .sb-sub { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: #334155; margin: 2px 0 5px; }
  .sb-sub .bi { width: 13px; height: 13px; }
  .sb-sub + .soft-select { margin-bottom: 10px; font-size: 13px; font-weight: 500; padding: 8px 11px; }
  .sb-footer { margin-top: auto; border-top: 1px solid var(--line); padding: 11px 12px 13px; text-align: center; }
  .sb-footer .credit { font-size: 11px; color: #94a3b8; }
  .sb-footer .credit b { color: var(--sub); font-weight: 600; }
  .sb-footer .demo-note { font-size: 10.5px; color: #b3bfcd; margin-top: 3px; }

  /* ── 滚动条 ── */
  .gallery::-webkit-scrollbar, .sidebar::-webkit-scrollbar, .modal-body::-webkit-scrollbar { width: 8px; height: 8px; }
  .gallery::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb, .modal-body::-webkit-scrollbar-thumb {
    background: #cbd5e1; border-radius: 999px;
  }
  .gallery::-webkit-scrollbar-thumb:hover, .sidebar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* ── 模态 ── */
  .overlay {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center;
    background: rgba(10, 14, 20, 0.55); backdrop-filter: blur(8px); padding: 24px;
  }
  .overlay.show { display: flex; }
  .modal {
    position: relative; background: #fff; border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    max-width: min(1060px, 100%); max-height: 100%;
    display: flex; flex-direction: column; overflow: hidden; animation: rise 0.28s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .modal-head {
    flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 18px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px;
  }
  .close-x {
    width: 30px; height: 30px; display: grid; place-items: center;
    color: var(--sub); background: #f1f3f7; border: none; border-radius: 50%;
    cursor: pointer; transition: all 0.18s;
  }
  .close-x .bi { width: 14px; height: 14px; }
  .close-x:hover { color: #fff; background: var(--danger); }
  .modal-body { overflow-y: auto; padding: 16px; }
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .compare-grid figure { margin: 0; min-width: 0; }
  .compare-grid .cmp-label {
    font-size: 12px; font-weight: 700; color: var(--sub); margin-bottom: 7px;
    display: flex; align-items: center; gap: 6px;
  }
  .cmp-label::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }
  .cmp-label.after::before { background: var(--success); }
  .compare-grid img {
    width: 100%; height: auto; max-height: 58vh; object-fit: contain;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; display: block;
  }
  .prompt-list { display: flex; flex-direction: column; gap: 12px; }
  .prompt-item h4 { margin: 0 0 5px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .prompt-item h4 .chip { font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1.5px 8px; }
  .chip.ok { color: var(--success); background: rgba(5, 150, 105, 0.1); }
  .chip.na { color: var(--muted); background: #f1f3f7; }
  .prompt-item pre {
    margin: 0; font-size: 11.5px; line-height: 1.65;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; color: var(--sub);
    background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }

  /* ── 双击放大灯箱 ── */
  .lightbox-overlay {
    position: fixed; inset: 0; z-index: 80; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    background: rgba(10, 14, 20, 0.82); backdrop-filter: blur(6px);
    padding: 28px; cursor: zoom-out;
  }
  .lightbox-overlay.show { display: flex; }
  .lightbox-overlay img {
    max-width: min(1100px, 92vw); max-height: 84vh;
    width: auto; height: auto; object-fit: contain;
    border-radius: 12px; background: #fff;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    animation: rise 0.25s ease;
  }
  .lightbox-caption { color: rgba(255, 255, 255, 0.85); font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; }

  /* ── toast ── */
  #toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(16px);
    max-width: 86%; padding: 10px 20px; font-size: 13px; font-weight: 600; color: #fff;
    background: rgba(15, 23, 42, 0.92); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(16, 24, 40, 0.25); opacity: 0; pointer-events: none;
    transition: all 0.25s ease; z-index: 70;
  }
  #toast.ok { background: rgba(5, 150, 105, 0.95); }

  /* ── 响应式 ── */
  @media (max-width: 1240px) { .view-toggle { display: none; } }
  @media (max-width: 1120px) {
    .mode-switch { display: none; }
    .ghost-btn .txt { display: none; }
    .ghost-btn { padding: 7px 11px; }
  }
  @media (max-width: 980px) {
    body { overflow: auto; }
    .workspace { flex-direction: column; overflow-y: auto; }
    .pane { flex: none; min-height: 0; }
    .pane-input { border-right: none; border-bottom: 1px solid var(--line); }
    .gallery { flex: none; overflow: visible; }
    .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--line); overflow: visible; flex: none; }
    .pane-head { flex-wrap: wrap; }
    .user-badge .u-id, .user-badge .u-out { display: none; }
    .compare-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 700px) {
    .user-badge, .nav-right > .vr, #historyBtn { display: none; }
    .top-nav { padding: 0 12px; gap: 8px; }
  }
  @media (max-width: 480px) {
    .brand-text { font-size: 15.5px; }
    .brand-icon { width: 30px; height: 30px; border-radius: 8px; }
    .brand-icon .bi { width: 16px; height: 16px; }
    .icon-btn { width: 32px; height: 32px; }
    .brand { gap: 7px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var toastTimer = null;
  function toast(msg, ok) {
    var el = $('toast');
    el.textContent = msg;
    el.style.opacity = '1';
    el.style.transform = 'translateX(-50%) translateY(0)';
    el.className = ok ? 'ok' : '';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.style.opacity = '0';
      el.style.transform = 'translateX(-50%) translateY(16px)';
    }, 2400);
  }

  /* ── 真实预设提示词（与内部工具 PROMPT_CONFIG 一致）── */
  var PRESETS = [
    {
      key: '2d_conversion', name: '图片转为彩色线稿', enabled: true,
      text: '## 部件图片二维化\n我会输入一张或多张照片，你的任务是将这些部件的照片，转化为精确的、二维风格的彩色工程线稿图。**严禁**将多张图片合并或拼接。输入N张图，必须输出N张独立的图。\n**最终输出的核心要求:**\n1.  **风格与维度 (Style & Dimension):**\n    - **彻底二维化**：最终成品必须是**完全平面、非写实**的彩色工程线稿。\n    - **禁止三维元素**：必须**彻底消除**所有三维特征，包括但不限于：**光影、阴影、高光、颜色渐变、材质纹理和透视深度**。\n    - **线条与颜色**：线条必须**干净、锐利、粗细统一**，具有技术图纸或CAD渲染图的精确线条感。所有颜色填充必须是**纯色平涂**。\n    - **形状细节**：必须**精确保留并清晰描绘**部件的所有几何形状和细节，不得有任何遗漏或模糊。\n    - **背景**：背景为纯白色，只保留这个部件本身。\n2.  **内容清理 (Content Cleaning):**\n    - 必须**彻底移除**部件上任何包含文字、二维码或条形码的标签和贴纸。\n**执行准则**：请将上述所有要求作为一个整体目标，独立地应用到我提供的每一张图片上，并为每张输入图片都生成一张对应的、独立的输出图片。'
    },
    {
      key: 'XG_conversion', name: '图片转为黑白线稿', enabled: true,
      text: '## 图片转线稿\n我会输入一张或多张汽车部件相关照片，你的任务是将这些照片，转化为精确的的黑白工程线稿图。\n**严禁**将多张图片合并或拼接。输入N张图，必须输出N张独立的图。\n**最终输出的核心要求:**\n1.  **风格与维度 (Style & Dimension):**\n    - **彻底二维化**：最终成品必须是**完全平面、非写实**的黑白工程线稿。\n    - **线条要求1**：线条必须**干净、锐利、粗细统一**，具有技术图纸或CAD渲染图的精确线条感。\n    - **线条要求2**：只要线条，不要阴影（No shading），不要灰度渐变（No gradients），线条深浅都固定，线条线宽都是1px。\n    - **背景**：背景为纯白色\n2.  **内容清理 (Content Cleaning):**\n    - 必须**彻底移除**部件上任何包含文字、二维码或条形码的标签和贴纸。\n**执行准则**：请将上述所有要求作为一个整体目标，独立地应用到我提供的每一张图片上，并为每张输入图片都生成一张对应的、独立的输出图片。'
    },
    {
      key: 'extract_rotate', name: '图片视角转动', enabled: false,

  /* ── 处理流程模拟 ── */
  function setProgress(pct, text) {
    $('progressBar').style.width = pct + '%';
    $('progressText').textContent = text || '';
  }

  function setRunBtn(mode) {
    var btn = $('runBtn');
    if (mode === 'run') {
      btn.classList.remove('stop');
      $('runBtnText').textContent = '开始处理';
      $('runBtnSub').textContent = '点击运行任务';
      btn.querySelector('.rl1 use').setAttribute('href', '#i-rocket');
    } else {
      btn.classList.add('stop');
      $('runBtnText').textContent = '停止处理';
      $('runBtnSub').textContent = '点击后将尽快停止';
      btn.querySelector('.rl1 use').setAttribute('href', '#i-stop');
    }
  }

  function stopRun(silent) {
    state.timers.forEach(clearTimeout);
    state.timers = [];
    state.running = false;
    setRunBtn('run');
    $('progressArea').classList.remove('show');
    setProgress(0, '');
    if (!silent) toast('已停止处理');
  }

  function resultCard(idx) {
    return document.querySelector('#outputGallery .img-card[data-idx="' + idx + '"]');
  }

  /* 待处理目标：没有同名输出的图片；「只处理勾选」开启时仅限勾选项 */
  function pendingTargets() {
    var only = $('processSelectedOnly').checked;
    var checked = {};
    document.querySelectorAll('#inputGallery .img-card.selected').forEach(function (c) {
      checked[c.dataset.idx] = true;
    });
    var list = [];
    for (var i = 0; i < PAIRS.length; i++) {
      if (resultCard(i)) continue;
      if (only && !checked[i]) continue;
      list.push(i);
    }
    return list;
  }

  function run() {
    if (state.running) { stopRun(); return; }
    var targets = pendingTargets();
    if (targets.length === 0) {
      if (document.querySelector('#outputGallery .img-card')) {
        /* 与真实工具一致：同名输出已存在则智能跳过 */
        toast('输出已存在，已智能跳过（真实工具行为：同名输出不重复生成）。删除结果后可重新生成。');
      } else if ($('processSelectedOnly').checked) {
        toast('「只处理勾选」已开启，请先勾选要处理的图片');
      } else {
        toast('没有待处理的图片');
      }
      return;
    }
    var p = state.preset;
    if (p.custom && !$('promptText').value.trim()) { toast('请先输入自定义提示词'); return; }

    state.running = true;
    setRunBtn('stop');
    $('progressArea').classList.add('show');
    document.querySelectorAll('#outputGallery .new-badge').forEach(function (b) { b.remove(); });
    var t0 = Date.now();
    var total = targets.length;

    setProgress(6, '提交任务…');
    state.timers.push(setTimeout(function () { setProgress(16, '上传图片 0/' + total + ' …'); }, 420));
    state.timers.push(setTimeout(function () {
      /* 生成阶段：setInterval 缓动爬升（后台标签页也能完成） */
      var genStart = Date.now();
      var genMs = 2400 + total * 140;
      var apiSel = $('apiSelect');
      var model = (apiSel.options[apiSel.selectedIndex].text.split('API_')[1] || 'Nano Banana').replace(/ \(.*\)$/, '');
      var iv = setInterval(function () {
        if (!state.running) { clearInterval(iv); return; }
        var k = Math.min((Date.now() - genStart) / genMs, 1);
        var eased = 1 - Math.pow(1 - k, 2.2);
        setProgress(16 + eased * 74, model + ' 生成中 … ' + Math.round(eased * 100) + '%');
        if (k >= 1) {
          clearInterval(iv);
          setProgress(92, '模型返回结果，解码图片…');
          state.timers.push(setTimeout(function () { emitResults(targets, t0, 0); }, 360));
        }
      }, 60);
    }, 900));
  }

  /* 解码阶段：逐张挂载结果卡片，模拟批量返回 */
  function emitResults(targets, t0, n) {
    if (n >= targets.length) {
      var secs = ((Date.now() - t0) / 1000).toFixed(1);
      setProgress(100, '完成');
      state.timers.push(setTimeout(function () { stopRun(true); }, 500));
      toast('批量处理完成 · ' + targets.length + ' 张 · 用时 ' + secs + 's', true);
      return;
    }
    addResultCard(targets[n]);
    setProgress(92 + ((n + 1) / targets.length) * 8, '解码图片 ' + (n + 1) + '/' + targets.length + ' …');
    state.timers.push(setTimeout(function () { emitResults(targets, t0, n + 1); }, 110));
  }

  function buildCard(opts) {
    var card = document.createElement('div');
    card.className = 'img-card' + (opts.gray ? ' gray' : '');
    var wrap = document.createElement('div');
    wrap.className = 'img-wrap';
    var img = document.createElement('img');
    img.src = opts.src;
    img.alt = opts.alt;
    wrap.appendChild(img);
    card.appendChild(wrap);
    var name = document.createElement('div');
    name.className = 'file-name';
    name.textContent = opts.name;
    card.appendChild(name);
    var check = document.createElement('input');
    check.type = 'checkbox';
    check.className = 'card-check';
    check.setAttribute('aria-label', '选择此图片');
    card.appendChild(check);
    return card;
  }

  function addResultCard(idx) {
    var pair = PAIRS[idx];
    var card = buildCard({ src: pair.after, alt: '处理后：' + pair.name, name: pair.name });
    card.dataset.idx = String(idx);
    card.classList.add('output');

    var actions = document.createElement('div');
    actions.className = 'card-actions';
    [
      ['i-split', '对比原图', function () { openPreview(idx); }],
      ['i-dl', '下载', function () { downloadOne(idx); }],
      ['i-trash', '删除', function () {
        card.remove();
        refreshOutputs();
        refreshSelStatus();
      }]
    ].forEach(function (item) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'act-circle' + (item[1] === '删除' ? ' del' : '');
      b.title = item[1];
      b.setAttribute('aria-label', item[1]);
      b.innerHTML = '<svg class="bi"><use href="#' + item[0] + '"/></svg>';
      b.addEventListener('click', function (e) { e.stopPropagation(); item[2](); });
      actions.appendChild(b);
    });
    card.appendChild(actions);

    var zoom = document.createElement('button');
    zoom.type = 'button';
    zoom.className = 'zoom-btn';
    zoom.title = '放大预览（或双击图片）';
    zoom.setAttribute('aria-label', '放大预览');
    zoom.innerHTML = '<svg class="bi"><use href="#i-expand"/></svg>';
    zoom.addEventListener('click', function (e) {
      e.stopPropagation();
      openLightbox(pair.after, pair.name + ' · 处理后');

    var badge = document.createElement('span');

    badge.textContent = '新生成';
    card.appendChild(badge);

    $('outputGallery').appendChild(card);
    refreshOutputs();

      frag.appendChild(card);
    });
    var gallery = $('inputGallery');
    gallery.insertBefore(frag, gallery.firstChild);
    $('inputCount').textContent = String(PAIRS.length);
  }

  /* ── 初始 ── */
  renderPresetSelect();
  applyPreset();
  renderInputs();
  refreshOutputs();
})();
</script>
</body>
</html>
