data-point-y="${connector.point ? connector.point.y : ''}"></canvas></div></div><div class="merged-bottom"><div class="img-container"><img src="${localImgPath}"onerror="this.onerror=null;this.src='${localImgPathPng}';"><div class="location-desc">${translatedLocationDesc}</div></div></div></div></td>`;let terminalsHtml='<div class="terminal-container">';let terminalCanvasIds=[];if(connector.terminals&&connector.terminals.length>0){connector.terminals.forEach((term,tIndex)=>{const tCanvasId=`canvas-term-${svgId}-${connector.id.replace(/[^a-zA-Z0-9]/g,'-')}-${index}-${tIndex}`;const tImgPath=`${imgPrefix}${CONFIG.folder_terminal_img}/${term.img}.webp`;const polarityHtml=(term.polarity&&term.polarity.trim()!=='')?`<div class="image-caption"style="font-size:0.9em;font-weight:bold;margin-top:4px">${term.polarity}</div>`:'';
terminalsHtml+=`<div class="terminal-item"><div class="img-container terminal-img-container"><canvas id="${tCanvasId}"
data-full-src="${tImgPath}"
data-base-w="900"data-base-h="675"
data-point-x="${term.point ? term.point.x : ''}"
data-point-y="${term.point ? term.point.y : ''}"></canvas>${polarityHtml}</div></div>`;terminalCanvasIds.push({id:tCanvasId,src:tImgPath,point:term.point});});}
terminalsHtml+='</div>';tr.innerHTML+=`<td class="terminal-col">${terminalsHtml}</td>`;tableBody.appendChild(tr);const allCanvasesToDraw=[{id:canvasId,src:measureImgPath,point:connector.point},...terminalCanvasIds];if('IntersectionObserver'in window){const observer=new IntersectionObserver((entries,obs)=>{entries.forEach(entry=>{if(entry.isIntersecting){const targetId=entry.target.id;const canvasConfig=allCanvasesToDraw.find(c=>c.id===targetId);if(canvasConfig)drawImageWithPoint(targetId,canvasConfig.src,canvasConfig.point);obs.unobserve(entry.target);}});},{rootMargin:'200px'});allCanvasesToDraw.forEach(c=>{const el=document.getElementById(c.id);if(el)observer.observe(el);});}else{allCanvasesToDraw.forEach(c=>drawImageWithPoint(c.id,c.src,c.point));}});});setupModal();setupHelpSystem();renderPaginationControls();}
function jumpToConnector(targetSvgId,targetConnectorId){const svgIds=Object.keys(filteredData);let targetPageIndex=-1;if(targetSvgId){const index=svgIds.indexOf(targetSvgId);if(index!==-1){targetPageIndex=Math.floor(index/CONFIG.items_per_page)+1;}}else{for(let i=0;i<svgIds.length;i++){const grp=filteredData[svgIds[i]];if(grp.connectors.some(c=>c.id===targetConnectorId)){targetPageIndex=Math.floor(i/CONFIG.items_per_page)+1;targetSvgId=svgIds[i];break;}}}
if(targetPageIndex===-1){console.warn('Target not found');return;}
if(currentPage!==targetPageIndex){renderTablePage(targetPageIndex);}
setTimeout(()=>{const targetRow=document.querySelector(`tr[data-connector-id="${targetConnectorId}"][data-svg-id="${targetSvgId}"]`);if(targetRow){targetRow.scrollIntoView({behavior:'smooth',block:'center'});document.querySelectorAll('.highlight-row').forEach(el=>el.classList.remove('highlight-row'));targetRow.classList.add('highlight-row');setTimeout(()=>targetRow.classList.remove('highlight-row'),3000);}},100);}
function renderPaginationControls(){const totalItems=Object.keys(filteredData).length;const totalPages=Math.ceil(totalItems/CONFIG.items_per_page);const paginationControlsTop=document.getElementById('pagination-controls-top');const paginationControlsBottom=document.getElementById('pagination-controls-bottom');if(totalPages<=1){paginationControlsTop.innerHTML='';paginationControlsBottom.innerHTML='';return;}
let paginationHtml=`<button id="prev-page-top"${(currentPage===1)?'disabled':''}>上一页</button><span class="pagination-info">${currentPage}/${totalPages}</span><button id="next-page-top"${(currentPage>=totalPages)?'disabled':''}>下一页</button>`;paginationControlsTop.innerHTML=paginationHtml;let paginationHtmlBottom=`<button id="prev-page-bottom"${(currentPage===1)?'disabled':''}>上一页</button><span class="pagination-info">${currentPage}/${totalPages}</span><button id="next-page-bottom"${(currentPage>=totalPages)?'disabled':''}>下一页</button>`;paginationControlsBottom.innerHTML=paginationHtmlBottom;document.getElementById('prev-page-top').addEventListener('click',()=>{if(currentPage>1)renderTablePage(currentPage-1);});document.getElementById('next-page-top').addEventListener('click',()=>{if(currentPage<totalPages)renderTablePage(currentPage+1);});document.getElementById('prev-page-bottom').addEventListener('click',()=>{if(currentPage>1)renderTablePage(currentPage-1);});document.getElementById('next-page-bottom').addEventListener('click',()=>{if(currentPage<totalPages)renderTablePage(currentPage+1);});}
function copyToClipboard(text,buttonElement){if(!navigator.clipboard){alert("您的浏览器不支持剪贴板功能。");return;}
navigator.clipboard.writeText(text).then(()=>{const originalText=buttonElement.innerText;buttonElement.innerText='🔵';buttonElement.disabled=true;setTimeout(()=>{buttonElement.innerText=originalText;buttonElement.disabled=false;},2000);}).catch(err=>{console.error('无法复制文本: ',err);alert('复制失败！');});}
function createFilterDropdown(columnKey,options){const container=document.getElementById(`filter-dropdown-${columnKey}`);const button=document.getElementById(`filter-btn-${columnKey}`);if(!container||!button)return;let content='';options.forEach(option=>{if(option)content+=`<label><input type="checkbox"value="${option}">${option}</label>`;});container.innerHTML=content;button.addEventListener('click',(e)=>{e.stopPropagation();toggleFilter(columnKey);});container.querySelectorAll('input[type="checkbox"]').forEach(checkbox=>{checkbox.addEventListener('change',()=>{if(checkbox.checked)activeFilters[columnKey].add(checkbox.value);else activeFilters[columnKey].delete(checkbox.value);updateFilterButtonText(button,columnKey);filterTable();});});}
function updateFilterButtonText(button,columnKey){const selectedCount=activeFilters[columnKey].size;if(selectedCount===0)button.textContent=button.title;else{const firstItem=activeFilters[columnKey].values().next().value;button.textContent=selectedCount===1?firstItem:`${firstItem}...(+${selectedCount-1})`;}}
function toggleFilter(columnKey){const dropdown=document.getElementById(`filter-dropdown-${columnKey}`);const isVisible=dropdown.style.display==='block';closeAllFilters();if(!isVisible)dropdown.style.display='block';}
function closeAllFilters(){document.querySelectorAll('.filter-dropdown').forEach(d=>d.style.display='none');}
function drawImageWithPoint(canvasId,imageUrl,point){const canvas=document.getElementById(canvasId);if(!canvas)return;const ctx=canvas.getContext('2d');const img=new Image();img.src=imageUrl;const baseW=parseInt(canvas.dataset.baseW)||400;const baseH=parseInt(canvas.dataset.baseH)||400;img.onload=()=>{canvas.width=baseW;canvas.height=baseH;ctx.drawImage(img,0,0,canvas.width,canvas.height);if(point&&point.x!==undefined&&point.y!==undefined){let drawX=point.x;let drawY=point.y;let radius=CONFIG.point_radius;if(baseW===900){drawX+=8;drawY+=8;radius=15;}
ctx.beginPath();ctx.arc(drawX,drawY,radius,0,2*Math.PI,false);ctx.fillStyle=CONFIG.point_color;ctx.fill();ctx.lineWidth=CONFIG.point_border_width;ctx.strokeStyle=CONFIG.point_border_color;ctx.stroke();}};img.onerror=()=>{const pngUrl=imageUrl.replace('.webp','.png');if(img.src!==pngUrl)img.src=pngUrl;else{ctx.font="16px Arial";ctx.fillStyle="red";ctx.textAlign="center";ctx.fillText("图片加载失败",canvas.width/2,canvas.height/2);}};}
function setupModal(){document.querySelectorAll('.img-container img, .img-container canvas, .svg-container object, .svg-container img').forEach(item=>{item.addEventListener('click',function(){const modal=document.getElementById("myModal");const modalContentContainer=document.getElementById("modal-content-container");modal.style.display="flex";modalContentContainer.innerHTML='';modalContentContainer.className='modal-content';if(this.tagName.toLowerCase()==='canvas'){const imageUrl=this.dataset.fullSrc;const pointX=parseFloat(this.dataset.pointX);const pointY=parseFloat(this.dataset.pointY);const baseW=parseInt(this.dataset.baseW)||400;const baseH=parseInt(this.dataset.baseH)||400;if(baseW===900)modalContentContainer.classList.add('canvas-magnified-large');else modalContentContainer.classList.add('canvas-magnified');const modalCanvas=document.createElement('canvas');modalContentContainer.appendChild(modalCanvas);const img=new Image();img.src=imageUrl;img.onerror=function(){if(imageUrl&&imageUrl.endsWith('.webp')){this.onerror=null;this.src=imageUrl.replace('.webp','.png');}};img.onload=()=>{const ctx=modalCanvas.getContext('2d');modalCanvas.width=baseW;modalCanvas.height=baseH;ctx.drawImage(img,0,0,baseW,baseH);if(!isNaN(pointX)&&!isNaN(pointY)){let drawX=pointX;let drawY=pointY;if(baseW===900){drawX+=8;drawY+=8;}
const radius=CONFIG.point_radius*1.5;ctx.beginPath();ctx.arc(drawX,drawY,radius,0,2*Math.PI,false);ctx.fillStyle=CONFIG.point_color;ctx.fill();ctx.lineWidth=CONFIG.point_border_width;ctx.strokeStyle=CONFIG.point_border_color;ctx.stroke();}};}else{let element;if(this.tagName.toLowerCase()==='object'||(this.tagName.toLowerCase()==='img'&&this.src.endsWith('.svg'))){element=document.createElement('object');element.type='image/svg+xml';element.data=this.data||this.src;}else{element=document.createElement('img');element.src=this.src;element.onerror=function(){if(this.src&&this.src.endsWith('.webp')){this.onerror=null;this.src=this.src.replace('.webp','.png');}};}
modalContentContainer.appendChild(element);}});});document.querySelector(".close").onclick=()=>{document.getElementById("myModal").style.display="none";};window.addEventListener('click',(event)=>{if(event.target==document.getElementById("myModal"))document.getElementById("myModal").style.display="none";});}
function setupHelpSystem(){const helpPopup=document.getElementById('help-popup');const overlay=document.getElementById('help-popup-overlay');const imgPrefix=CONFIG.image_path_prefix||'';document.querySelectorAll('.help-button').forEach(button=>{const newButton=button.cloneNode(true);button.parentNode.replaceChild(newButton,button);newButton.addEventListener('click',(e)=>{const svgId=e.currentTarget.dataset.svgId;const helpInfo=HELP_DATA[svgId];const lang=currentLanguage;if(!helpInfo){helpPopup.innerHTML=`<div class="help-popup-header"><h3>${UI_TEXT[lang].help_title}</h3><button class="help-popup-close">×</button></div><div class="help-popup-content"><p>${UI_TEXT[lang].no_help_info}</p></div>`;}else{let content=`<div class="help-popup-header"><h3>${UI_TEXT[lang].help_title}</h3><button class="help-popup-close">×</button></div><div class="help-popup-content">`;if(helpInfo.codes&&helpInfo.codes.length>0){content+=`<div class="help-table-title">${UI_TEXT[lang].codes_title}</div><table class="help-table codes-table">`;for(let i=0;i<helpInfo.codes.length;i+=2){const code1Text=getTranslatedText(helpInfo.codes[i].text);const code2Text=i+1<helpInfo.codes.length?getTranslatedText(helpInfo.codes[i+1].text):'';content+=`<tr><td>${helpInfo.codes[i].code}</td><td>${code1Text}</td>`;if(i+1<helpInfo.codes.length)content+=`<td>${helpInfo.codes[i+1].code}</td><td>${code2Text}</td>`;else content+='<td></td><td></td>';content+='</tr>';}
content+='</table>';}
if(helpInfo.icons&&helpInfo.icons.length>0){content+=`<div class="help-table-title">${UI_TEXT[lang].icons_title}</div><table class="help-table icons-table">`;for(let i=0;i<helpInfo.icons.length;i++){const icon=helpInfo.icons[i];const iconText=getTranslatedText(icon.text);content+=`<tr><td style="width: 25%;"><img src="${imgPrefix}${CONFIG.folder_help_icons}/${icon.code}.png"class="help-icon-img"></td><td>${iconText}</td></tr>`;}
content+='</table>';}
content+='</div>';helpPopup.innerHTML=content;}
helpPopup.classList.add('is-visible');overlay.style.display='block';helpPopup.querySelector('.help-popup-close').addEventListener('click',()=>{helpPopup.classList.remove('is-visible');overlay.style.display='none';});});});if(!overlay.dataset.listenerAttached){overlay.addEventListener('click',()=>{helpPopup.classList.remove('is-visible');overlay.style.display='none';});overlay.dataset.listenerAttached='true';}}
document.addEventListener('DOMContentLoaded',()=>{filteredData=DATA;if(CONFIG.show_filter_bar){createFilterDropdown('svgId',UNIQUE_FILTERS.svg_ids);createFilterDropdown('connector',UNIQUE_FILTERS.connectors);createFilterDropdown('measureImg',UNIQUE_FILTERS.measure_imgs);createFilterDropdown('localImg',UNIQUE_FILTERS.local_imgs);createFilterDropdown('componentName',UNIQUE_FILTERS.component_names);createFilterDropdown('locationDesc',UNIQUE_FILTERS.location_descs);window.addEventListener('click',(e)=>{if(!e.target.closest('.filter-dropdown')&&!e.target.closest('.filter-button'))closeAllFilters();});}
updateStaticText();renderTablePage(1);});
